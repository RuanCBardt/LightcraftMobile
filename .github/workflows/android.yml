name: Android
on:
  workflow_dispatch:
  push:
    branches: [mobile/android]
    paths: ['apps/android/**', 'crates/mobile/**', 'scripts/build-android*', 'Cargo.*', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'crates/mobile/**', 'scripts/build-android*', 'Cargo.*', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Rust checks
        run: |
          cargo fmt -p lightcraft-mobile --check
          cargo clippy -p lightcraft-mobile -- -D warnings
          cargo test -p lightcraft-mobile
      - name: Build native engines and APK
        run: bash scripts/build-android.sh
      - name: Android lint
        working-directory: apps/android
        run: ./gradlew lintDebug
      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          working-directory: apps/android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lightcraft-mobile-debug
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/reports/lint-results-debug.html
